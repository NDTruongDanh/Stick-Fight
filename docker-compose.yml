# LAN room server: web client (dist/) + authoritative WS room server on :8080.
# One port serves both: open http://<server-ip>:8080 in a browser, then HOST
# a room (share the code) or JOIN with a room code.
services:
  stickfight:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
